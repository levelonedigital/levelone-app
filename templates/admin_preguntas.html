{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-white fw-bold mb-0">📝 Examen: {{ curso.title }}</h3>
    <a href="/admin/cursos2" class="btn btn-outline-light btn-sm">← Volver</a>
  </div>

  <div class="card mb-4">
    <div class="card-header fw-bold">➕ Agregar Pregunta</div>
    <div class="card-body">
      <form method="POST" action="/admin/cursos2/preguntas/agregar">
        <input type="hidden" name="course_id" value="{{ curso.id }}">
        <div class="row g-3">
          <div class="col-12"><label class="form-label small">Pregunta *</label><input name="question" class="form-control" required></div>
          <div class="col-md-3"><label class="form-label small">Opción A</label><input name="option_a" class="form-control"></div>
          <div class="col-md-3"><label class="form-label small">Opción B</label><input name="option_b" class="form-control"></div>
          <div class="col-md-3"><label class="form-label small">Opción C</label><input name="option_c" class="form-control"></div>
          <div class="col-md-3"><label class="form-label small">Opción D</label><input name="option_d" class="form-control"></div>
          <div class="col-md-3"><label class="form-label small">Respuesta correcta</label>
            <select name="correct_option" class="form-control"><option>A</option><option>B</option><option>C</option><option>D</option></select>
          </div>
        </div>
        <button class="btn btn-primary mt-3">💾 Agregar Pregunta</button>
      </form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-sm">
      <thead><tr><th>Pregunta</th><th>Correcta</th><th></th></tr></thead>
      <tbody>
      {% for p in preguntas %}
        <tr>
          <td>{{ p.question }}</td>
          <td><span class="badge bg-success">{{ p.correct_option }}</span></td>
          <td>
            <form method="POST" action="/admin/cursos2/preguntas/eliminar/{{ p.id }}" class="d-inline" onsubmit="return confirm('¿Eliminar pregunta?');">
              <button class="btn btn-sm btn-outline-danger">🗑️</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3" class="text-center text-muted">Sin preguntas aún.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
