{% extends "base.html" %}
{% block content %}
<style>
select.form-control, select.form-select { appearance: menulist !important; -webkit-appearance: menulist !important; background-image: none !important; }
</style>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-white fw-bold mb-0">✏️ Editar Curso</h3>
    <a href="/admin/cursos2" class="btn btn-outline-light btn-sm">← Volver</a>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label small">Nombre del curso *</label><input name="title" class="form-control" value="{{ c.title }}" required></div>
          <div class="col-md-6"><label class="form-label small">Imagen (URL)</label><input name="image_url" class="form-control" value="{{ c.image_url or '' }}"></div>
          <div class="col-12"><label class="form-label small">Descripción</label><textarea name="description" class="form-control" rows="2">{{ c.description or '' }}</textarea></div>
          <div class="col-md-3"><label class="form-label small">Fecha inicio</label><input type="date" name="start_date" class="form-control" value="{{ c.start_date.strftime('%Y-%m-%d') if c.start_date else '' }}"></div>
          <div class="col-md-3"><label class="form-label small">Fecha fin</label><input type="date" name="end_date" class="form-control" value="{{ c.end_date.strftime('%Y-%m-%d') if c.end_date else '' }}"></div>
          <div class="col-md-3"><label class="form-label small">Precio regular ($)</label><input type="number" step="0.01" name="price_regular" class="form-control" value="{{ c.price_regular or 0 }}"></div>
          <div class="col-md-3"><label class="form-label small">Precio con licencia ($)</label><input type="number" step="0.01" name="price_levelone" class="form-control" value="{{ c.price_levelone or 0 }}"></div>
          <div class="col-md-3 form-check mt-4"><input type="checkbox" class="form-check-input" name="has_exam" id="he" {% if c.has_exam %}checked{% endif %}><label class="form-check-label" for="he">Tiene examen final</label></div>
          <div class="col-md-3"><label class="form-label small">Nota mínima (%)</label><input type="number" name="exam_pass_score" class="form-control" value="{{ c.exam_pass_score or 70 }}"></div>
          <div class="col-md-3"><label class="form-label small">Intentos</label><input type="number" name="exam_attempts" class="form-control" value="{{ c.exam_attempts or 3 }}"></div>
          <div class="col-md-3"><label class="form-label small">Estado ▼</label><select name="status" class="form-control"><option value="active" {% if c.status=='active' %}selected{% endif %}>Activo</option><option value="inactive" {% if c.status=='inactive' %}selected{% endif %}>Inactivo</option></select></div>
        </div>
        <button class="btn btn-primary mt-3">💾 Guardar Cambios</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
